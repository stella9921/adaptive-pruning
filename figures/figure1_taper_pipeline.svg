<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #102a43; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #455a64; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #102a43; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #37474f; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #455a64; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 21px; fill: #263238; font-style: italic; }
      .box { fill: #ffffff; stroke: #263238; stroke-width: 2; rx: 14; }
      .soft { fill: #f5f7fa; stroke: #607d8b; stroke-width: 1.6; rx: 12; }
      .bluebox { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 12; }
      .orangebox { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; rx: 12; }
      .greenbox { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 12; }
      .redbox { fill: #ffebee; stroke: #c62828; stroke-width: 2; rx: 12; }
      .purplebox { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 2; rx: 12; }
      .removed { fill: #eeeeee; stroke: #9e9e9e; stroke-width: 2; stroke-dasharray: 7 6; rx: 10; }
      .arrow { stroke: #263238; stroke-width: 2.6; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #1565c0; stroke-width: 2.8; fill: none; marker-end: url(#arrowBlue); }
      .dash { stroke: #607d8b; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .channel { stroke: #455a64; stroke-width: 1; }
      .selected { fill: #ef5350; stroke: #b71c1c; stroke-width: 1; }
      .unselected { fill: #eceff1; stroke: #78909c; stroke-width: 1; }
      .dense { fill: #90caf9; stroke: #1565c0; stroke-width: 1; }
      .pruned { fill: #ffcc80; stroke: #ef6c00; stroke-width: 1; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="980" fill="#ffffff"/>

  <text x="52" y="58" class="title">Figure 1. Transition-Aware Channel-Selective Compensation after Depth Pruning</text>
  <text x="52" y="90" class="subtitle">Depth-first pruning removes a redundant block interval; channel-level mismatch/outlier signals select where lightweight affine compensation is applied before fine-tuning.</text>

  <!-- Stage headers -->
  <rect x="52" y="125" width="515" height="70" class="bluebox"/>
  <text x="78" y="168" class="section">1. Redundant Depth Region Discovery</text>

  <rect x="642" y="125" width="515" height="70" class="orangebox"/>
  <text x="668" y="168" class="section">2. Physical Depth Pruning</text>

  <rect x="1232" y="125" width="515" height="70" class="greenbox"/>
  <text x="1258" y="168" class="section">3. Channel-Selective Boundary Compensation</text>

  <!-- Stage 1: dense transformer blocks -->
  <rect x="52" y="220" width="515" height="245" class="soft"/>
  <text x="76" y="252" class="label">Dense model hidden states</text>
  <text x="76" y="278" class="small">Find a redundant interval in the full block timeline.</text>

  <g transform="translate(87,315)">
    <rect x="0" y="0" width="56" height="78" class="bluebox"/>
    <text x="17" y="46" class="label">B0</text>
    <rect x="70" y="0" width="56" height="78" class="bluebox"/>
    <text x="87" y="46" class="label">...</text>
    <rect x="140" y="0" width="56" height="78" class="bluebox"/>
    <text x="154" y="46" class="label">Bi</text>
    <rect x="210" y="0" width="56" height="78" class="bluebox" opacity="0.55"/>
    <text x="221" y="46" class="label">Bi+1</text>
    <rect x="280" y="0" width="56" height="78" class="bluebox" opacity="0.55"/>
    <text x="297" y="46" class="label">...</text>
    <rect x="350" y="0" width="56" height="78" class="bluebox" opacity="0.55"/>
    <text x="361" y="46" class="label">Bj-1</text>
    <rect x="420" y="0" width="56" height="78" class="bluebox"/>
    <text x="436" y="46" class="label">Bj</text>
    <path d="M56,39 H70 M126,39 H140 M196,39 H210 M266,39 H280 M336,39 H350 M406,39 H420" class="arrow"/>
    <path d="M168,-24 C230,-62 390,-62 448,-24" class="arrowBlue"/>
    <text x="223" y="-70" class="math">sim(i,j)=cos(H_i,H_j)</text>
    <text x="206" y="112" class="small">candidate redundant interval</text>
  </g>

  <g transform="translate(84,432)">
    <text x="0" y="0" class="tiny">Full depth axis</text>
    <rect x="92" y="-18" width="342" height="22" fill="#ffffff" stroke="#607d8b" stroke-width="1.2"/>
    <rect x="92" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="116" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="140" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="164" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="188" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="212" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="236" y="-18" width="24" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <rect x="260" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="284" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="308" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="332" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="356" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="380" y="-18" width="24" height="22" fill="#ef9a9a" stroke="#b71c1c" stroke-width="1.1"/>
    <rect x="404" y="-18" width="30" height="22" fill="#bbdefb" stroke="#607d8b" stroke-width="0.8"/>
    <path d="M260,-26 H404" stroke="#c62828" stroke-width="2.3" stroke-dasharray="5 4" fill="none"/>
    <text x="265" y="28" class="tiny" fill="#b71c1c">pruned blocks: B_{i+1} ... B_{j-1}</text>
  </g>

  <!-- Stage 2: pruning -->
  <rect x="642" y="220" width="515" height="245" class="soft"/>
  <text x="666" y="252" class="label">Remove the intermediate blocks</text>
  <text x="666" y="278" class="small">The right boundary block now receives a shifted input distribution.</text>

  <g transform="translate(685,315)">
    <rect x="0" y="0" width="64" height="78" class="orangebox"/>
    <text x="21" y="46" class="label">Bi</text>
    <rect x="98" y="0" width="225" height="78" class="removed"/>
    <line x1="118" y1="16" x2="303" y2="62" stroke="#9e9e9e" stroke-width="2"/>
    <line x1="303" y1="16" x2="118" y2="62" stroke="#9e9e9e" stroke-width="2"/>
    <text x="137" y="46" class="label">remove Bi+1 ... Bj-1</text>
    <rect x="365" y="0" width="64" height="78" class="orangebox"/>
    <text x="383" y="46" class="label">Bj</text>
    <path d="M64,39 H98" class="arrow"/>
    <path d="M323,39 H365" class="arrow"/>
    <path d="M64,118 C150,170 315,170 397,118" class="dash"/>
    <text x="92" y="204" class="small">transition gap appears at the pruning boundary</text>
  </g>

  <g transform="translate(682,432)">
    <text x="0" y="0" class="tiny">After pruning</text>
    <rect x="92" y="-18" width="342" height="22" fill="#ffffff" stroke="#607d8b" stroke-width="1.2"/>
    <rect x="92" y="-18" width="126" height="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="0.9"/>
    <rect x="218" y="-18" width="146" height="22" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.2" stroke-dasharray="5 4"/>
    <rect x="364" y="-18" width="70" height="22" fill="#ffe0b2" stroke="#ef6c00" stroke-width="0.9"/>
    <line x1="238" y1="-15" x2="344" y2="1" stroke="#9e9e9e" stroke-width="1.7"/>
    <line x1="344" y1="-15" x2="238" y2="1" stroke="#9e9e9e" stroke-width="1.7"/>
    <path d="M218,-31 C250,-58 332,-58 364,-31" class="arrowBlue"/>
    <text x="205" y="30" class="tiny" fill="#ef6c00">B_i is directly connected to B_j</text>
  </g>

  <!-- Stage 3 top: boundary zoom -->
  <rect x="1232" y="220" width="515" height="245" class="soft"/>
  <text x="1256" y="252" class="label">Boundary zoom-in: what is compensated?</text>
  <text x="1256" y="278" class="small">Only selected hidden-state channels are affine-adjusted before entering Bj.</text>

  <g transform="translate(1264,308)">
    <rect x="0" y="32" width="70" height="92" class="orangebox"/>
    <text x="18" y="85" class="label">Bi</text>
    <rect x="390" y="32" width="70" height="92" class="orangebox"/>
    <text x="409" y="85" class="label">Bj</text>
    <path d="M70,78 H128" class="arrow"/>
    <path d="M312,78 H390" class="arrow"/>

    <!-- hidden vector before compensation -->
    <text x="120" y="18" class="small">pruned boundary input</text>
    <g transform="translate(128,38)">
      <rect x="0" y="0" width="154" height="80" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/>
      <rect x="0" y="0" width="14" height="80" class="unselected"/>
      <rect x="14" y="0" width="14" height="80" class="selected"/>
      <rect x="28" y="0" width="14" height="80" class="unselected"/>
      <rect x="42" y="0" width="14" height="80" class="unselected"/>
      <rect x="56" y="0" width="14" height="80" class="selected"/>
      <rect x="70" y="0" width="14" height="80" class="unselected"/>
      <rect x="84" y="0" width="14" height="80" class="selected"/>
      <rect x="98" y="0" width="14" height="80" class="unselected"/>
      <rect x="112" y="0" width="14" height="80" class="unselected"/>
      <rect x="126" y="0" width="14" height="80" class="selected"/>
      <rect x="140" y="0" width="14" height="80" class="unselected"/>
    </g>

    <rect x="305" y="42" width="44" height="72" class="greenbox"/>
    <text x="316" y="73" class="small">α,β</text>
    <text x="310" y="94" class="tiny">on S</text>
  </g>

  <path d="M1046,440 C1160,500 1210,355 1268,355" class="arrowBlue"/>
  <text x="1124" y="503" class="tiny" fill="#1565c0">zoom into the new transition</text>

  <!-- Lower detailed panel -->
  <rect x="52" y="515" width="1695" height="385" class="box"/>
  <text x="82" y="552" class="section">Detailed Stage 2: Mismatch / Outlier-Aware Channel Selection and Affine Compensation</text>

  <!-- dense vs pruned boundary distributions -->
  <rect x="88" y="590" width="510" height="260" class="soft"/>
  <text x="110" y="622" class="label">A. Measure channel-wise boundary mismatch</text>
  <text x="110" y="649" class="small">Compare the original dense boundary input and the pruned boundary input.</text>

  <g transform="translate(120,682)">
    <text x="0" y="-12" class="small">Dense boundary input</text>
    <text x="0" y="110" class="small">After depth pruning</text>
    <g transform="translate(160,0)">
      <rect x="0" y="0" width="270" height="62" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
      <rect x="0" y="0" width="24" height="62" class="dense"/>
      <rect x="24" y="0" width="24" height="62" class="dense"/>
      <rect x="48" y="0" width="24" height="62" class="dense"/>
      <rect x="72" y="0" width="24" height="62" class="dense"/>
      <rect x="96" y="0" width="24" height="62" class="dense"/>
      <rect x="120" y="0" width="24" height="62" class="dense"/>
      <rect x="144" y="0" width="24" height="62" class="dense"/>
      <rect x="168" y="0" width="24" height="62" class="dense"/>
      <rect x="192" y="0" width="24" height="62" class="dense"/>
      <rect x="216" y="0" width="24" height="62" class="dense"/>
      <rect x="240" y="0" width="30" height="62" class="dense"/>
      <text x="88" y="39" class="math">μᵈ, σᵈ</text>
    </g>
    <g transform="translate(160,122)">
      <rect x="0" y="0" width="270" height="62" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
      <rect x="0" y="0" width="24" height="62" class="pruned"/>
      <rect x="24" y="0" width="24" height="62" class="pruned"/>
      <rect x="48" y="0" width="24" height="62" class="pruned"/>
      <rect x="72" y="0" width="24" height="62" class="pruned"/>
      <rect x="96" y="0" width="24" height="62" class="pruned"/>
      <rect x="120" y="0" width="24" height="62" class="pruned"/>
      <rect x="144" y="0" width="24" height="62" class="pruned"/>
      <rect x="168" y="0" width="24" height="62" class="pruned"/>
      <rect x="192" y="0" width="24" height="62" class="pruned"/>
      <rect x="216" y="0" width="24" height="62" class="pruned"/>
      <rect x="240" y="0" width="30" height="62" class="pruned"/>
      <text x="88" y="39" class="math">μᵖ, σᵖ</text>
    </g>
    <text x="65" y="220" class="math">m_c = |μᵈ_c - μᵖ_c| + |σᵈ_c - σᵖ_c|</text>
  </g>

  <!-- score and selection -->
  <rect x="648" y="590" width="460" height="260" class="soft"/>
  <text x="670" y="622" class="label">B. Select channels to compensate</text>
  <text x="670" y="649" class="small">High mismatch and outlier-sensitive channels receive compensation.</text>
  <g transform="translate(698,684)">
    <rect x="0" y="0" width="360" height="62" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
    <rect x="0" y="0" width="30" height="62" class="unselected"/>
    <rect x="30" y="0" width="30" height="62" class="selected"/>
    <rect x="60" y="0" width="30" height="62" class="unselected"/>
    <rect x="90" y="0" width="30" height="62" class="unselected"/>
    <rect x="120" y="0" width="30" height="62" class="selected"/>
    <rect x="150" y="0" width="30" height="62" class="unselected"/>
    <rect x="180" y="0" width="30" height="62" class="selected"/>
    <rect x="210" y="0" width="30" height="62" class="unselected"/>
    <rect x="240" y="0" width="30" height="62" class="unselected"/>
    <rect x="270" y="0" width="30" height="62" class="selected"/>
    <rect x="300" y="0" width="30" height="62" class="unselected"/>
    <rect x="330" y="0" width="30" height="62" class="unselected"/>
    <text x="60" y="105" class="math">s_c = m_c + λ_o o_c</text>
    <text x="78" y="145" class="math">S = TopK_c(s_c, ρC)</text>
    <rect x="30" y="-22" width="30" height="12" class="selected"/>
    <text x="70" y="-12" class="tiny">selected high mismatch/outlier channels</text>
  </g>

  <!-- affine compensation -->
  <rect x="1158" y="590" width="545" height="260" class="soft"/>
  <text x="1180" y="622" class="label">C. Apply affine only on selected channels</text>
  <text x="1180" y="649" class="small">Unselected channels pass through unchanged; selected channels are distribution-matched.</text>
  <g transform="translate(1195,681)">
    <rect x="0" y="16" width="300" height="68" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
    <rect x="0" y="16" width="25" height="68" class="unselected"/>
    <rect x="25" y="16" width="25" height="68" class="selected"/>
    <rect x="50" y="16" width="25" height="68" class="unselected"/>
    <rect x="75" y="16" width="25" height="68" class="unselected"/>
    <rect x="100" y="16" width="25" height="68" class="selected"/>
    <rect x="125" y="16" width="25" height="68" class="unselected"/>
    <rect x="150" y="16" width="25" height="68" class="selected"/>
    <rect x="175" y="16" width="25" height="68" class="unselected"/>
    <rect x="200" y="16" width="25" height="68" class="unselected"/>
    <rect x="225" y="16" width="25" height="68" class="selected"/>
    <rect x="250" y="16" width="25" height="68" class="unselected"/>
    <rect x="275" y="16" width="25" height="68" class="unselected"/>
    <path d="M308,50 H365" class="arrow"/>
    <rect x="372" y="0" width="120" height="100" class="greenbox"/>
    <text x="392" y="35" class="label">Affine</text>
    <text x="391" y="62" class="small">selected</text>
    <text x="404" y="84" class="small">channels</text>
    <text x="8" y="130" class="math">h'_c = α_c h_c + β_c,  c ∈ S</text>
    <text x="8" y="164" class="math">h'_c = h_c,  c ∉ S</text>
    <text x="8" y="205" class="small">α, β are estimated from calibration statistics, then the compact model can be fine-tuned.</text>
  </g>

  <!-- arrows between lower panels -->
  <path d="M598,720 H648" class="arrow"/>
  <path d="M1108,720 H1158" class="arrow"/>

  <!-- bottom legend -->
  <g transform="translate(82,925)">
    <rect x="0" y="-15" width="22" height="22" class="dense"/>
    <text x="32" y="2" class="small">dense boundary statistics</text>
    <rect x="250" y="-15" width="22" height="22" class="pruned"/>
    <text x="282" y="2" class="small">pruned boundary statistics</text>
    <rect x="520" y="-15" width="22" height="22" class="selected"/>
    <text x="552" y="2" class="small">selected channels</text>
    <rect x="735" y="-15" width="22" height="22" class="unselected"/>
    <text x="767" y="2" class="small">unchanged channels</text>
  </g>
</svg>
