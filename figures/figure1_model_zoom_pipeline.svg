<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1050" viewBox="0 0 1900 1050">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#263238"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#1565c0"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 34px; font-weight: 700; fill: #102a43; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 20px; fill: #455a64; }
      .section { font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 700; fill: #102a43; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 18px; fill: #263238; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #37474f; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 13px; fill: #455a64; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 22px; fill: #263238; font-style: italic; }
      .panel { fill: #f7f9fb; stroke: #263238; stroke-width: 2; rx: 16; }
      .subpanel { fill: #ffffff; stroke: #607d8b; stroke-width: 1.6; rx: 14; }
      .block { fill: #e3f2fd; stroke: #1565c0; stroke-width: 2; rx: 10; }
      .boundary { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2.4; rx: 10; }
      .removed { fill: #ffebee; stroke: #c62828; stroke-width: 2.4; stroke-dasharray: 8 6; rx: 10; }
      .comp { fill: #e8f5e9; stroke: #2e7d32; stroke-width: 2; rx: 10; }
      .purple { fill: #f3e5f5; stroke: #6a1b9a; stroke-width: 2; rx: 10; }
      .arrow { stroke: #263238; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .arrowBlue { stroke: #1565c0; stroke-width: 2.8; fill: none; marker-end: url(#arrowBlue); }
      .thin { stroke: #607d8b; stroke-width: 1.4; fill: none; }
      .dash { stroke: #78909c; stroke-width: 2; stroke-dasharray: 6 6; fill: none; }
      .selected { fill: #ef5350; stroke: #b71c1c; stroke-width: 1; }
      .unselected { fill: #eceff1; stroke: #78909c; stroke-width: 1; }
      .dense { fill: #90caf9; stroke: #1565c0; stroke-width: 1; }
      .pruned { fill: #ffcc80; stroke: #ef6c00; stroke-width: 1; }
      .highlight { fill: none; stroke: #c62828; stroke-width: 4; stroke-dasharray: 10 7; rx: 16; }
      .zoomline { stroke: #78909c; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1900" height="1050" fill="#ffffff"/>

  <text x="54" y="58" class="title">Figure 1. Depth Pruning Followed by Mismatch-Aware Channel Compensation</text>
  <text x="54" y="92" class="subtitle">A redundant depth region is removed from the compact model, and the newly exposed boundary is compensated only on selected hidden channels.</text>

  <!-- Main model pipeline -->
  <rect x="54" y="130" width="1792" height="395" class="panel"/>
  <text x="88" y="170" class="section">One Transformer Model, Viewed Across Depth</text>
  <text x="88" y="199" class="small">The full model is shown as a sequence of transformer blocks. The method first identifies one redundant interval, then zooms into the new boundary created by pruning.</text>

  <!-- Input embedding -->
  <g transform="translate(94,260)">
    <rect x="0" y="0" width="88" height="120" fill="#ffffff" stroke="#263238" stroke-width="2" rx="8"/>
    <text x="20" y="52" class="label">Input</text>
    <text x="16" y="78" class="label">tokens</text>
    <g transform="translate(12,88)">
      <rect x="0" y="0" width="9" height="9" fill="#cfd8dc"/><rect x="12" y="0" width="9" height="9" fill="#cfd8dc"/><rect x="24" y="0" width="9" height="9" fill="#cfd8dc"/><rect x="36" y="0" width="9" height="9" fill="#cfd8dc"/><rect x="48" y="0" width="9" height="9" fill="#cfd8dc"/>
      <rect x="0" y="12" width="9" height="9" fill="#cfd8dc"/><rect x="12" y="12" width="9" height="9" fill="#cfd8dc"/><rect x="24" y="12" width="9" height="9" fill="#cfd8dc"/><rect x="36" y="12" width="9" height="9" fill="#cfd8dc"/><rect x="48" y="12" width="9" height="9" fill="#cfd8dc"/>
    </g>
  </g>

  <!-- Full block sequence -->
  <g transform="translate(230,236)">
    <path d="M-38,84 H0" class="arrow"/>
    <rect x="0" y="0" width="76" height="168" class="block"/>
    <text x="17" y="78" class="label">B0</text>
    <text x="15" y="104" class="small">kept</text>
    <path d="M76,84 H112" class="arrow"/>

    <rect x="112" y="0" width="76" height="168" class="block"/>
    <text x="132" y="78" class="label">B1</text>
    <text x="127" y="104" class="small">kept</text>
    <path d="M188,84 H224" class="arrow"/>

    <rect x="224" y="0" width="76" height="168" class="block"/>
    <text x="240" y="78" class="label">...</text>
    <text x="240" y="104" class="small">kept</text>
    <path d="M300,84 H336" class="arrow"/>

    <rect x="336" y="0" width="86" height="168" class="boundary"/>
    <text x="363" y="78" class="label">Bᵢ</text>
    <text x="354" y="104" class="small">left</text>
    <text x="342" y="126" class="small">boundary</text>
    <path d="M422,84 H458" class="arrow"/>

    <rect x="458" y="0" width="93" height="168" class="removed"/>
    <text x="475" y="70" class="label">Bᵢ₊₁</text>
    <text x="475" y="100" class="small">remove</text>
    <line x1="470" y1="25" x2="540" y2="143" stroke="#c62828" stroke-width="3"/>
    <line x1="540" y1="25" x2="470" y2="143" stroke="#c62828" stroke-width="3"/>
    <path d="M551,84 H587" class="arrow"/>

    <rect x="587" y="0" width="93" height="168" class="removed"/>
    <text x="620" y="78" class="label">...</text>
    <text x="607" y="104" class="small">remove</text>
    <line x1="599" y1="25" x2="669" y2="143" stroke="#c62828" stroke-width="3"/>
    <line x1="669" y1="25" x2="599" y2="143" stroke="#c62828" stroke-width="3"/>
    <path d="M680,84 H716" class="arrow"/>

    <rect x="716" y="0" width="93" height="168" class="removed"/>
    <text x="736" y="70" class="label">Bⱼ₋₁</text>
    <text x="736" y="100" class="small">remove</text>
    <line x1="728" y1="25" x2="798" y2="143" stroke="#c62828" stroke-width="3"/>
    <line x1="798" y1="25" x2="728" y2="143" stroke="#c62828" stroke-width="3"/>
    <path d="M809,84 H845" class="arrow"/>

    <rect x="845" y="0" width="86" height="168" class="boundary"/>
    <text x="872" y="78" class="label">Bⱼ</text>
    <text x="864" y="104" class="small">right</text>
    <text x="850" y="126" class="small">boundary</text>
    <path d="M931,84 H967" class="arrow"/>

    <rect x="967" y="0" width="76" height="168" class="block"/>
    <text x="987" y="78" class="label">...</text>
    <text x="983" y="104" class="small">kept</text>
    <path d="M1043,84 H1079" class="arrow"/>

    <rect x="1079" y="0" width="86" height="168" class="block"/>
    <text x="1093" y="78" class="label">Bₗₐₛₜ</text>
    <text x="1100" y="104" class="small">kept</text>
    <path d="M1165,84 H1206" class="arrow"/>

    <rect x="1216" y="30" width="110" height="108" fill="#ffffff" stroke="#263238" stroke-width="2" rx="8"/>
    <text x="1242" y="77" class="label">LM</text>
    <text x="1234" y="103" class="label">Head</text>

    <rect x="444" y="-22" width="383" height="212" class="highlight"/>
    <text x="500" y="-44" class="label" fill="#b71c1c">pruned depth region</text>
    <text x="505" y="216" class="math">sim(i,j)=cos(Hᵢ,Hⱼ), remove Bᵢ₊₁...Bⱼ₋₁</text>
  </g>

  <!-- Compact connection overlay -->
  <path d="M652,457 C790,545 1008,545 1118,457" class="arrowBlue"/>
  <text x="750" y="505" class="label" fill="#1565c0">after pruning, Bᵢ feeds directly into Bⱼ</text>
  <text x="800" y="532" class="small">this new transition is where mismatch appears</text>

  <!-- Zoom lines to lower panel -->
  <path d="M1086,418 C1160,555 1280,550 1388,600" class="zoomline"/>
  <path d="M1160,418 C1240,530 1370,548 1515,600" class="zoomline"/>

  <!-- Lower detailed zoom panel -->
  <rect x="54" y="575" width="1792" height="405" class="panel"/>
  <text x="88" y="615" class="section">Zoomed Boundary View: Channel-Level Compensation at the Bᵢ → Bⱼ Transition</text>

  <!-- Left lower: dense vs pruned transition -->
  <rect x="86" y="650" width="520" height="285" class="subpanel"/>
  <text x="112" y="684" class="label">A. Boundary mismatch after depth pruning</text>
  <text x="112" y="711" class="small">The right boundary Bⱼ used to receive dense hidden statistics, but now receives Bᵢ output.</text>

  <g transform="translate(118,745)">
    <rect x="0" y="0" width="72" height="74" class="boundary"/>
    <text x="22" y="44" class="label">Bᵢ</text>
    <rect x="382" y="0" width="72" height="74" class="boundary"/>
    <text x="405" y="44" class="label">Bⱼ</text>
    <path d="M72,37 H120" class="arrow"/>
    <path d="M325,37 H382" class="arrow"/>

    <text x="122" y="-18" class="tiny">pruned input to Bⱼ</text>
    <rect x="122" y="3" width="198" height="68" fill="#ffffff" stroke="#455a64" stroke-width="1.5"/>
    <rect x="122" y="3" width="18" height="68" class="pruned"/>
    <rect x="140" y="3" width="18" height="68" class="pruned"/>
    <rect x="158" y="3" width="18" height="68" class="pruned"/>
    <rect x="176" y="3" width="18" height="68" class="pruned"/>
    <rect x="194" y="3" width="18" height="68" class="pruned"/>
    <rect x="212" y="3" width="18" height="68" class="pruned"/>
    <rect x="230" y="3" width="18" height="68" class="pruned"/>
    <rect x="248" y="3" width="18" height="68" class="pruned"/>
    <rect x="266" y="3" width="18" height="68" class="pruned"/>
    <rect x="284" y="3" width="18" height="68" class="pruned"/>
    <rect x="302" y="3" width="18" height="68" class="pruned"/>

    <path d="M122,114 H320" class="dash"/>
    <rect x="122" y="130" width="198" height="44" fill="#ffffff" stroke="#1565c0" stroke-width="1.5"/>
    <rect x="122" y="130" width="18" height="44" class="dense"/>
    <rect x="140" y="130" width="18" height="44" class="dense"/>
    <rect x="158" y="130" width="18" height="44" class="dense"/>
    <rect x="176" y="130" width="18" height="44" class="dense"/>
    <rect x="194" y="130" width="18" height="44" class="dense"/>
    <rect x="212" y="130" width="18" height="44" class="dense"/>
    <rect x="230" y="130" width="18" height="44" class="dense"/>
    <rect x="248" y="130" width="18" height="44" class="dense"/>
    <rect x="266" y="130" width="18" height="44" class="dense"/>
    <rect x="284" y="130" width="18" height="44" class="dense"/>
    <rect x="302" y="130" width="18" height="44" class="dense"/>
    <text x="104" y="207" class="math">m_c = |μᵈ_c-μᵖ_c| + |σᵈ_c-σᵖ_c|</text>
  </g>

  <!-- Center lower: channel selection -->
  <rect x="655" y="650" width="520" height="285" class="subpanel"/>
  <text x="681" y="684" class="label">B. Select channels by mismatch and outlier</text>
  <text x="681" y="711" class="small">Selection happens along the hidden dimension, not at the block/head level.</text>

  <g transform="translate(700,755)">
    <text x="0" y="-12" class="tiny">hidden channels of Bⱼ input</text>
    <rect x="0" y="0" width="400" height="74" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/>
    <rect x="0" y="0" width="25" height="74" class="unselected"/>
    <rect x="25" y="0" width="25" height="74" class="selected"/>
    <rect x="50" y="0" width="25" height="74" class="unselected"/>
    <rect x="75" y="0" width="25" height="74" class="unselected"/>
    <rect x="100" y="0" width="25" height="74" class="selected"/>
    <rect x="125" y="0" width="25" height="74" class="unselected"/>
    <rect x="150" y="0" width="25" height="74" class="selected"/>
    <rect x="175" y="0" width="25" height="74" class="unselected"/>
    <rect x="200" y="0" width="25" height="74" class="unselected"/>
    <rect x="225" y="0" width="25" height="74" class="selected"/>
    <rect x="250" y="0" width="25" height="74" class="unselected"/>
    <rect x="275" y="0" width="25" height="74" class="unselected"/>
    <rect x="300" y="0" width="25" height="74" class="selected"/>
    <rect x="325" y="0" width="25" height="74" class="unselected"/>
    <rect x="350" y="0" width="25" height="74" class="unselected"/>
    <rect x="375" y="0" width="25" height="74" class="unselected"/>
    <text x="56" y="124" class="math">o_c = max(E[(hᵈ_c)^2], E[(hᵖ_c)^2])</text>
    <text x="90" y="166" class="math">s_c = m_c + λ_o o_c</text>
    <text x="98" y="208" class="math">S = TopK_c(s_c, ρC)</text>
  </g>

  <!-- Right lower: affine -->
  <rect x="1224" y="650" width="590" height="285" class="subpanel"/>
  <text x="1250" y="684" class="label">C. Apply affine compensation only on selected channels</text>
  <text x="1250" y="711" class="small">The compact model is then optionally fine-tuned after one-shot compensation.</text>

  <g transform="translate(1265,758)">
    <rect x="0" y="0" width="280" height="78" fill="#ffffff" stroke="#455a64" stroke-width="1.6"/>
    <rect x="0" y="0" width="20" height="78" class="unselected"/>
    <rect x="20" y="0" width="20" height="78" class="selected"/>
    <rect x="40" y="0" width="20" height="78" class="unselected"/>
    <rect x="60" y="0" width="20" height="78" class="unselected"/>
    <rect x="80" y="0" width="20" height="78" class="selected"/>
    <rect x="100" y="0" width="20" height="78" class="unselected"/>
    <rect x="120" y="0" width="20" height="78" class="selected"/>
    <rect x="140" y="0" width="20" height="78" class="unselected"/>
    <rect x="160" y="0" width="20" height="78" class="unselected"/>
    <rect x="180" y="0" width="20" height="78" class="selected"/>
    <rect x="200" y="0" width="20" height="78" class="unselected"/>
    <rect x="220" y="0" width="20" height="78" class="unselected"/>
    <rect x="240" y="0" width="20" height="78" class="selected"/>
    <rect x="260" y="0" width="20" height="78" class="unselected"/>

    <path d="M290,39 H348" class="arrow"/>
    <rect x="358" y="-8" width="154" height="94" class="comp"/>
    <text x="384" y="30" class="label">Affine</text>
    <text x="381" y="57" class="small">on channels</text>
    <text x="411" y="78" class="small">c ∈ S</text>
    <text x="20" y="126" class="math">h'_c = α_c h_c + β_c,  c ∈ S</text>
    <text x="20" y="166" class="math">h'_c = h_c,  c ∉ S</text>
    <text x="20" y="211" class="math">α_c = σᵈ_c / (σᵖ_c + ε),  β_c = μᵈ_c - α_c μᵖ_c</text>
  </g>

  <!-- Connections lower panels -->
  <path d="M606,790 H655" class="arrow"/>
  <path d="M1175,790 H1224" class="arrow"/>

  <!-- Legend -->
  <g transform="translate(82,1015)">
    <rect x="0" y="-16" width="22" height="22" class="boundary"/>
    <text x="32" y="1" class="small">boundary block</text>
    <rect x="190" y="-16" width="22" height="22" class="removed"/>
    <text x="222" y="1" class="small">removed depth region</text>
    <rect x="440" y="-16" width="22" height="22" class="dense"/>
    <text x="472" y="1" class="small">dense statistics</text>
    <rect x="660" y="-16" width="22" height="22" class="pruned"/>
    <text x="692" y="1" class="small">pruned statistics</text>
    <rect x="880" y="-16" width="22" height="22" class="selected"/>
    <text x="912" y="1" class="small">selected channels for affine compensation</text>
  </g>
</svg>
