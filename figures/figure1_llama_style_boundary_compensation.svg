<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#1f1f1f"/>
    </marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L9,5.5 L1,10 Z" fill="#b71c1c"/>
    </marker>
    <style>
      .title { font-family: "Times New Roman", Times, serif; font-size: 34px; font-weight: 700; fill: #111; }
      .section { font-family: "Times New Roman", Times, serif; font-size: 23px; font-weight: 700; fill: #111; }
      .label { font-family: "Times New Roman", Times, serif; font-size: 18px; fill: #111; }
      .small { font-family: "Times New Roman", Times, serif; font-size: 15px; fill: #222; }
      .tiny { font-family: "Times New Roman", Times, serif; font-size: 13px; fill: #333; }
      .math { font-family: "Times New Roman", Times, serif; font-size: 22px; fill: #111; font-style: italic; }
      .panel { fill: #f4f6f8; stroke: #222; stroke-width: 2; rx: 12; }
      .zoom { fill: #f8fafc; stroke: #222; stroke-width: 2; rx: 12; }
      .layer { fill: #fff; stroke: #222; stroke-width: 2; rx: 8; }
      .prunedLayer { fill: #f1f1f1; stroke: #555; stroke-width: 2; stroke-dasharray: 7 5; rx: 8; }
      .norm { fill: #fff; stroke: #222; stroke-width: 1.8; rx: 6; }
      .weight { fill: #f4dfd2; stroke: #222; stroke-width: 1.8; rx: 4; }
      .op { fill: #fff; stroke: #222; stroke-width: 1.7; rx: 6; }
      .affine { fill: #e9f4e7; stroke: #222; stroke-width: 1.8; rx: 6; }
      .channelSel { fill: #fff7e6; stroke: #222; stroke-width: 1.8; rx: 6; }
      .arrow { stroke: #1f1f1f; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .thinArrow { stroke: #1f1f1f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .redArrow { stroke: #b71c1c; stroke-width: 2.2; fill: none; marker-end: url(#arrowRed); }
      .dash { stroke: #555; stroke-width: 1.7; fill: none; stroke-dasharray: 6 5; }
      .redDash { stroke: #b71c1c; stroke-width: 2.6; fill: none; stroke-dasharray: 8 6; }
      .token { fill: #fdfdfd; stroke: #222; stroke-width: 1; }
      .denseCh { fill: #dce9f7; stroke: #222; stroke-width: 0.8; }
      .prunedCh { fill: #f9dfc3; stroke: #222; stroke-width: 0.8; }
      .selectCh { fill: #111; stroke: #111; stroke-width: 0.8; }
      .keepCh { fill: #fff; stroke: #222; stroke-width: 0.8; }
    </style>
  </defs>

  <rect width="1900" height="1080" fill="#fff"/>

  <text x="64" y="62" class="title">Figure 1. Depth Pruning with Mismatch-Aware Channel Compensation</text>

  <!-- Main Llama stack panel -->
  <rect x="56" y="92" width="1788" height="450" class="panel"/>
  <text x="86" y="130" class="section">Overall Llama Decoder Stack</text>
  <text x="86" y="158" class="small">Llama-3.2-3B uses hidden dimension 3072 and 28 decoder blocks. A redundant interval is removed, then the new boundary is analyzed at hidden-channel level.</text>

  <!-- tokens grid -->
  <g transform="translate(94,255)">
    <text x="0" y="-18" class="label">Input tokens</text>
    <g>
      <rect x="0" y="0" width="12" height="12" class="token"/><rect x="14" y="0" width="12" height="12" class="token"/><rect x="28" y="0" width="12" height="12" class="token"/><rect x="42" y="0" width="12" height="12" class="token"/><rect x="56" y="0" width="12" height="12" class="token"/>
      <rect x="0" y="14" width="12" height="12" class="token"/><rect x="14" y="14" width="12" height="12" class="token"/><rect x="28" y="14" width="12" height="12" class="token"/><rect x="42" y="14" width="12" height="12" class="token"/><rect x="56" y="14" width="12" height="12" class="token"/>
      <rect x="0" y="28" width="12" height="12" class="token"/><rect x="14" y="28" width="12" height="12" class="token"/><rect x="28" y="28" width="12" height="12" class="token"/><rect x="42" y="28" width="12" height="12" class="token"/><rect x="56" y="28" width="12" height="12" class="token"/>
      <rect x="0" y="42" width="12" height="12" class="token"/><rect x="14" y="42" width="12" height="12" class="token"/><rect x="28" y="42" width="12" height="12" class="token"/><rect x="42" y="42" width="12" height="12" class="token"/><rect x="56" y="42" width="12" height="12" class="token"/>
    </g>
    <text x="-4" y="92" class="small">Embedding</text>
    <text x="-2" y="113" class="small">dim = 3072</text>
  </g>

  <!-- Decoder stack with Llama-like internal symbols -->
  <g transform="translate(205,205)">
    <path d="M-38,95 H0" class="arrow"/>

    <!-- kept layer template mini -->
    <g transform="translate(0,0)">
      <rect x="0" y="0" width="125" height="190" class="layer"/>
      <text x="38" y="26" class="label">Layer 0</text>
      <rect x="16" y="45" width="30" height="110" class="norm"/>
      <text x="23" y="112" class="tiny" transform="rotate(-90 23 112)">RMSNorm</text>
      <rect x="58" y="45" width="50" height="34" class="weight"/>
      <text x="64" y="67" class="tiny">GQA</text>
      <rect x="58" y="102" width="50" height="34" class="weight"/>
      <text x="66" y="124" class="tiny">MLP</text>
      <path d="M46,62 H58" class="thinArrow"/>
      <path d="M46,119 H58" class="thinArrow"/>
    </g>
    <path d="M125,95 H158" class="arrow"/>

    <g transform="translate(158,0)">
      <rect x="0" y="0" width="125" height="190" class="layer"/>
      <text x="42" y="26" class="label">...</text>
      <rect x="16" y="45" width="30" height="110" class="norm"/>
      <text x="23" y="112" class="tiny" transform="rotate(-90 23 112)">RMSNorm</text>
      <rect x="58" y="45" width="50" height="34" class="weight"/>
      <text x="64" y="67" class="tiny">GQA</text>
      <rect x="58" y="102" width="50" height="34" class="weight"/>
      <text x="66" y="124" class="tiny">FFN</text>
    </g>
    <path d="M283,95 H316" class="arrow"/>

    <!-- left boundary -->
    <g transform="translate(316,0)">
      <rect x="0" y="0" width="135" height="190" class="layer"/>
      <text x="48" y="26" class="label">Layer i</text>
      <rect x="15" y="45" width="31" height="110" class="norm"/>
      <text x="22" y="112" class="tiny" transform="rotate(-90 22 112)">RMSNorm</text>
      <rect x="58" y="38" width="58" height="35" class="weight"/>
      <text x="69" y="61" class="tiny">GQA</text>
      <rect x="58" y="88" width="58" height="35" class="weight"/>
      <text x="65" y="111" class="tiny">SwiGLU</text>
      <circle cx="122" cy="78" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="117" y="84" class="tiny">+</text>
      <circle cx="122" cy="129" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="117" y="135" class="tiny">+</text>
    </g>
    <path d="M451,95 H488" class="arrow"/>

    <!-- pruned interval -->
    <g transform="translate(488,0)">
      <rect x="0" y="0" width="145" height="190" class="prunedLayer"/>
      <text x="27" y="52" class="label">Layer i+1</text>
      <text x="44" y="84" class="small">pruned</text>
      <line x1="22" y1="30" x2="123" y2="160" stroke="#b71c1c" stroke-width="3"/>
      <line x1="123" y1="30" x2="22" y2="160" stroke="#b71c1c" stroke-width="3"/>
    </g>
    <path d="M633,95 H670" class="arrow"/>
    <g transform="translate(670,0)">
      <rect x="0" y="0" width="145" height="190" class="prunedLayer"/>
      <text x="62" y="78" class="label">...</text>
      <text x="44" y="111" class="small">pruned</text>
      <line x1="22" y1="30" x2="123" y2="160" stroke="#b71c1c" stroke-width="3"/>
      <line x1="123" y1="30" x2="22" y2="160" stroke="#b71c1c" stroke-width="3"/>
    </g>
    <path d="M815,95 H852" class="arrow"/>
    <g transform="translate(852,0)">
      <rect x="0" y="0" width="145" height="190" class="prunedLayer"/>
      <text x="29" y="52" class="label">Layer j-1</text>
      <text x="44" y="84" class="small">pruned</text>
      <line x1="22" y1="30" x2="123" y2="160" stroke="#b71c1c" stroke-width="3"/>
      <line x1="123" y1="30" x2="22" y2="160" stroke="#b71c1c" stroke-width="3"/>
    </g>
    <path d="M997,95 H1034" class="arrow"/>

    <!-- right boundary -->
    <g transform="translate(1034,0)">
      <rect x="0" y="0" width="135" height="190" class="layer"/>
      <text x="48" y="26" class="label">Layer j</text>
      <rect x="15" y="45" width="31" height="110" class="norm"/>
      <text x="22" y="112" class="tiny" transform="rotate(-90 22 112)">RMSNorm</text>
      <rect x="58" y="38" width="58" height="35" class="weight"/>
      <text x="69" y="61" class="tiny">GQA</text>
      <rect x="58" y="88" width="58" height="35" class="weight"/>
      <text x="65" y="111" class="tiny">SwiGLU</text>
      <circle cx="122" cy="78" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="117" y="84" class="tiny">+</text>
      <circle cx="122" cy="129" r="9" fill="#fff" stroke="#222" stroke-width="1.5"/>
      <text x="117" y="135" class="tiny">+</text>
    </g>
    <path d="M1169,95 H1206" class="arrow"/>

    <g transform="translate(1206,0)">
      <rect x="0" y="0" width="125" height="190" class="layer"/>
      <text x="42" y="26" class="label">...</text>
      <rect x="16" y="45" width="30" height="110" class="norm"/>
      <text x="23" y="112" class="tiny" transform="rotate(-90 23 112)">RMSNorm</text>
      <rect x="58" y="45" width="50" height="34" class="weight"/>
      <text x="64" y="67" class="tiny">GQA</text>
      <rect x="58" y="102" width="50" height="34" class="weight"/>
      <text x="66" y="124" class="tiny">FFN</text>
    </g>
    <path d="M1331,95 H1368" class="arrow"/>
    <rect x="1368" y="40" width="105" height="110" class="layer"/>
    <text x="1394" y="86" class="label">LM</text>
    <text x="1387" y="112" class="label">Head</text>

    <!-- Interval annotations -->
    <rect x="474" y="-24" width="537" height="238" class="redDash"/>
    <text x="575" y="-47" class="label" fill="#b71c1c">depth-pruned redundant interval</text>
    <path d="M451,238 C592,315 908,315 1034,238" class="redArrow"/>
    <text x="595" y="346" class="math">After pruning: Hᵖ = output(Layer i) is fed into Layer j</text>
    <text x="494" y="394" class="small">Transformer Block × 28: RMSNorm → GQA Attention → Residual → RMSNorm → SwiGLU FFN → Residual</text>
  </g>

  <!-- Llama block spec callout -->
  <rect x="1438" y="145" width="360" height="145" fill="#ffffff" stroke="#222" stroke-width="1.8" rx="10"/>
  <text x="1460" y="176" class="label">Llama-3.2-3B block spec</text>
  <text x="1460" y="204" class="small">hidden dim: 3072</text>
  <text x="1460" y="228" class="small">GQA: Q heads 24, KV heads 8</text>
  <text x="1460" y="252" class="small">head dim: 128</text>
  <text x="1460" y="276" class="small">SwiGLU FFN: 3072 → 8192 → 3072</text>

  <!-- zoom callout lines -->
  <path d="M1265,382 C1310,548 1430,560 1510,616" class="dash"/>
  <path d="M1380,382 C1420,530 1550,555 1655,616" class="dash"/>
  <text x="1315" y="507" class="small">zoom into this boundary input</text>

  <!-- Zoom lower panel -->
  <rect x="56" y="575" width="1788" height="440" class="zoom"/>
  <text x="86" y="615" class="section">Boundary Hidden Channels: Mismatch Measurement, Channel Selection, and Affine Compensation</text>

  <!-- Dense vs pruned panel -->
  <rect x="92" y="650" width="500" height="300" fill="#fff" stroke="#222" stroke-width="1.7" rx="10"/>
  <text x="122" y="684" class="label">1) Compare boundary statistics</text>
  <text x="122" y="711" class="small">Dense input expected by Layer j vs. pruned input from Layer i.</text>
  <g transform="translate(132,758)">
    <text x="0" y="25" class="small">Dense Hᵈ</text>
    <rect x="115" y="0" width="270" height="58" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <rect x="115" y="0" width="27" height="58" class="denseCh"/><rect x="142" y="0" width="27" height="58" class="denseCh"/><rect x="169" y="0" width="27" height="58" class="denseCh"/><rect x="196" y="0" width="27" height="58" class="denseCh"/><rect x="223" y="0" width="27" height="58" class="denseCh"/><rect x="250" y="0" width="27" height="58" class="denseCh"/><rect x="277" y="0" width="27" height="58" class="denseCh"/><rect x="304" y="0" width="27" height="58" class="denseCh"/><rect x="331" y="0" width="27" height="58" class="denseCh"/><rect x="358" y="0" width="27" height="58" class="denseCh"/>
    <text x="0" y="120" class="small">Pruned Hᵖ</text>
    <rect x="115" y="95" width="270" height="58" fill="#fff" stroke="#222" stroke-width="1.4"/>
    <rect x="115" y="95" width="27" height="58" class="prunedCh"/><rect x="142" y="95" width="27" height="58" class="prunedCh"/><rect x="169" y="95" width="27" height="58" class="prunedCh"/><rect x="196" y="95" width="27" height="58" class="prunedCh"/><rect x="223" y="95" width="27" height="58" class="prunedCh"/><rect x="250" y="95" width="27" height="58" class="prunedCh"/><rect x="277" y="95" width="27" height="58" class="prunedCh"/><rect x="304" y="95" width="27" height="58" class="prunedCh"/><rect x="331" y="95" width="27" height="58" class="prunedCh"/><rect x="358" y="95" width="27" height="58" class="prunedCh"/>
    <text x="75" y="220" class="math">m_c = |μᵈ_c - μᵖ_c| + |σᵈ_c - σᵖ_c|</text>
  </g>

  <!-- Channel selection panel -->
  <rect x="638" y="650" width="500" height="300" fill="#fff" stroke="#222" stroke-width="1.7" rx="10"/>
  <text x="668" y="684" class="label">2) Select high-risk hidden channels</text>
  <text x="668" y="711" class="small">Selection is along hidden channels, not transformer blocks.</text>
  <g transform="translate(690,766)">
    <rect x="0" y="0" width="395" height="74" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <rect x="0" y="0" width="25" height="74" class="keepCh"/><rect x="25" y="0" width="25" height="74" class="selectCh"/><rect x="50" y="0" width="25" height="74" class="keepCh"/><rect x="75" y="0" width="25" height="74" class="keepCh"/><rect x="100" y="0" width="25" height="74" class="selectCh"/><rect x="125" y="0" width="25" height="74" class="keepCh"/><rect x="150" y="0" width="25" height="74" class="selectCh"/><rect x="175" y="0" width="25" height="74" class="keepCh"/><rect x="200" y="0" width="25" height="74" class="keepCh"/><rect x="225" y="0" width="25" height="74" class="selectCh"/><rect x="250" y="0" width="25" height="74" class="keepCh"/><rect x="275" y="0" width="25" height="74" class="keepCh"/><rect x="300" y="0" width="25" height="74" class="selectCh"/><rect x="325" y="0" width="25" height="74" class="keepCh"/><rect x="350" y="0" width="25" height="74" class="keepCh"/><rect x="375" y="0" width="20" height="74" class="keepCh"/>
    <text x="25" y="115" class="math">o_c = max(E[(hᵈ_c)^2], E[(hᵖ_c)^2])</text>
    <text x="72" y="158" class="math">s_c = m_c + λ_o o_c</text>
    <text x="84" y="202" class="math">S = TopK_c(s_c, ρC)</text>
  </g>

  <!-- Affine panel -->
  <rect x="1184" y="650" width="612" height="300" fill="#fff" stroke="#222" stroke-width="1.7" rx="10"/>
  <text x="1214" y="684" class="label">3) Affine compensation before Layer j</text>
  <text x="1214" y="711" class="small">Affine is applied to the hidden state before Layer j RMSNorm; other channels pass through.</text>
  <g transform="translate(1226,765)">
    <rect x="0" y="0" width="268" height="80" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <rect x="0" y="0" width="22" height="80" class="keepCh"/><rect x="22" y="0" width="22" height="80" class="selectCh"/><rect x="44" y="0" width="22" height="80" class="keepCh"/><rect x="66" y="0" width="22" height="80" class="keepCh"/><rect x="88" y="0" width="22" height="80" class="selectCh"/><rect x="110" y="0" width="22" height="80" class="keepCh"/><rect x="132" y="0" width="22" height="80" class="selectCh"/><rect x="154" y="0" width="22" height="80" class="keepCh"/><rect x="176" y="0" width="22" height="80" class="keepCh"/><rect x="198" y="0" width="22" height="80" class="selectCh"/><rect x="220" y="0" width="22" height="80" class="keepCh"/><rect x="242" y="0" width="26" height="80" class="keepCh"/>
    <path d="M280,40 H330" class="arrow"/>
    <rect x="342" y="-5" width="120" height="90" class="affine"/>
    <text x="370" y="32" class="label">Affine</text>
    <text x="363" y="57" class="small">only c ∈ S</text>
    <path d="M470,40 H515" class="arrow"/>
    <rect x="525" y="-5" width="54" height="90" class="norm"/>
    <text x="541" y="66" class="tiny" transform="rotate(-90 541 66)">RMSNorm</text>
    <text x="505" y="-18" class="tiny">Layer j input</text>
    <text x="18" y="124" class="math">h'_c = α_c h_c + β_c, c ∈ S;     h'_c = h_c, c ∉ S</text>
    <text x="18" y="170" class="math">α_c = σᵈ_c/(σᵖ_c+ε),     β_c = μᵈ_c - α_c μᵖ_c</text>
    <text x="18" y="214" class="small">h ∈ R^{T × 3072}; selected channels S are hidden dimensions, not attention heads or FFN neurons.</text>
  </g>

  <!-- between lower panels -->
  <path d="M592,800 H638" class="arrow"/>
  <path d="M1138,800 H1184" class="arrow"/>

  <!-- legend -->
  <g transform="translate(84,1034)">
    <rect x="0" y="-16" width="22" height="22" class="weight"/><text x="32" y="2" class="small">Llama weight module</text>
    <rect x="210" y="-16" width="22" height="22" class="prunedLayer"/><text x="242" y="2" class="small">removed layer interval</text>
    <rect x="460" y="-16" width="22" height="22" class="denseCh"/><text x="492" y="2" class="small">dense boundary channel</text>
    <rect x="710" y="-16" width="22" height="22" class="prunedCh"/><text x="742" y="2" class="small">pruned boundary channel</text>
    <rect x="965" y="-16" width="22" height="22" class="selectCh"/><text x="997" y="2" class="small">selected channel</text>
  </g>
</svg>
