method: "PDT"        # main.py에서 인식할 수 있도록 추가
type: "pdt_hessian"  # 전략 구분을 위해 명시
ema_decay: 0.9       # 1차 미분(Gradient) 반영 비율
target_ratio: 0.9    # 프루닝 목표 비율

# 실행 시점 및 주기 설정 (다른 파일들과 맞춤)
start_epoch: 70
prune_every: 20
min_keep_ratio: 0.2

# [Ver.3 Hessian 추가 설정]
lambda_h: 0.0        # Hessian 점수 반영 비중
hessian_iter: 5      # CG 알고리즘 반복 횟수