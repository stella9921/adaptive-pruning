model_name: "vit_tiny_patch16_224"  # timm 라이브러리 모델명 기준
input_shape: [1, 3, 224, 224]

# --- MCPrune 핵심 설정 ---
strategy:
  name: "ViTPDTPruner"              # 우리가 만든 ViT 전용 클래스 이름
  channel_keep_ratio: 0.2           # 최종적으로 남길 비율 (80% 프루닝)
  min_survival_ratio: 0.1           # 각 레이어당 최소 10%는 남김
  ema_decay: 0.95                   # Gradient EMA 업데이트 가중치
  lambda_h: 0.005                   # Hessian 중요도 반영 계수
  hessian_iter: 10                  # Hessian-Free 엔진 반복 횟수

# --- 토폴로지 분석용 키워드 (topology_manager.py 연동) ---
topology:
  block_keyword: "Block"            # Transformer 블록 단위 식별자
  qkv_keyword: "qkv"                # Attention 입력부
  output_keyword: ["proj", "fc2"]   # Residual Connection 합산부
  inter_keyword: ["fc1"]            # MLP 중간 확장부